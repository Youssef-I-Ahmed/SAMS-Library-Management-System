services:
  postgres:
    image: postgres:16
    container_name: sams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sams_library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - sams_postgres_data:/var/lib/postgresql/data
volumes:
  sams_postgres_data:
